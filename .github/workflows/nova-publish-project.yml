        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          corepack enable npm
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        run: |
          npx turbo run check --filter=// --filter=homebridge-adt-pulse-app-config-ui --filter=homebridge-adt-pulse-docs --filter=homebridge-adt-pulse --concurrency=2
