          NOVA_SUMMARY_ROW_2_WORKSPACE: "homebridge-adt-pulse"
          NOVA_SUMMARY_ROW_2_WORKSPACE_OUTPUT: "${{ needs['publish-npm-packages-homebridge-adt-pulse'].outputs.summary_workspace_0 || '' }}"
