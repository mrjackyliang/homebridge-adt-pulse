      - name: "Build project"
        run: |
          npx turbo run build --filter=homebridge-adt-pulse-app-config-ui --filter=homebridge-adt-pulse-docs --filter=homebridge-adt-pulse --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Upload build artifacts (npm/packages-homebridge-adt-pulse)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-npm-packages-homebridge-adt-pulse"
          retention-days: 1
          path: |
            packages/homebridge-adt-pulse/build

      - name: "Upload build artifacts (github-packages/packages-homebridge-adt-pulse)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-github-packages-packages-homebridge-adt-pulse"
          retention-days: 1
          path: |
            packages/homebridge-adt-pulse/build

      - name: "Upload build artifacts (github-pages-docusaurus/apps-docs)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-github-pages-docusaurus-apps-docs"
          retention-days: 1
          path: |
            apps/docs/build

  publish-npm-packages-homebridge-adt-pulse:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: "Remove deprecated .npmrc entries"
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          if [ -f "$npmrc" ]; then
            sed -i '/^always-auth=/d' "$npmrc"
          fi

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-npm-packages-homebridge-adt-pulse"
          path: "./packages/homebridge-adt-pulse/build"

      - name: "Configure authentication"
        env:
          NPM_TOKEN: "${{ secrets.PROJECT_NPM_TOKEN }}"
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "[Auth] Using NPM_TOKEN (token-based)."
            echo "NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"
          else
            echo "[Auth] Using trusted publishing (OIDC)."

            npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

            if [ -f "$npmrc" ]; then
              sed -i '/^\/\/registry\.npmjs\.org\/:_authToken/d' "$npmrc"
              echo "[Auth] Removed _authToken entry from .npmrc."
            fi
          fi

      - name: "Publish package to npm"
        run: |
          if [ "${PUBLISH}" = "true" ]; then
            echo "[Publish] Production."
            npm publish --provenance --access public
          else
            echo "[Publish] Dry run."
            npm publish --dry-run
          fi
        working-directory: "./packages/homebridge-adt-pulse"

  publish-github-packages-packages-homebridge-adt-pulse:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      packages: "write"
      id-token: "write"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Configure registry for GitHub Packages"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"

      - name: "Remove deprecated .npmrc entries"
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          if [ -f "$npmrc" ]; then
            sed -i '/^always-auth=/d' "$npmrc"
          fi

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-github-packages-packages-homebridge-adt-pulse"
          path: "./packages/homebridge-adt-pulse/build"

      - name: "Change to scoped package name"
        run: |
          REPOSITORY_OWNER="@$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          PACKAGE_NAME=$(npm pkg get name --workspaces=false | jq -r '.')

          echo "[Scope] Owner is \"${REPOSITORY_OWNER}\" and package is \"${PACKAGE_NAME}\"."

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

          if [[ "$PACKAGE_NAME" != "$REPOSITORY_OWNER/"* ]]; then
            BASE=${PACKAGE_NAME##*/}
            NEW_NAME="$REPOSITORY_OWNER/$BASE"

            echo "[Scope] Scoping package name to \"${NEW_NAME}\"."

            npm pkg set name="$NEW_NAME"
          else
            echo "[Scope] Already scoped. No changes needed."
          fi
        working-directory: "./packages/homebridge-adt-pulse"

      - name: "Configure authentication"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          echo "[Auth] Using GITHUB_TOKEN."
          echo "NODE_AUTH_TOKEN=${GITHUB_TOKEN}" >> "$GITHUB_ENV"

      - name: "Publish package to GitHub Packages"
        run: |
          if [ "${PUBLISH}" = "true" ]; then
            echo "[Publish] Production."
            npm publish
          else
            echo "[Publish] Dry run."
            npm publish --dry-run
          fi
        working-directory: "./packages/homebridge-adt-pulse"

      - name: "Restore package name"
        if: "${{ always() && env.PACKAGE_NAME }}"
        run: |
          npm pkg set name="$PACKAGE_NAME"
        working-directory: "./packages/homebridge-adt-pulse"

  publish-github-pages-docusaurus-apps-docs:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      pages: "write"
      id-token: "write"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-github-pages-docusaurus-apps-docs"
          path: "./apps/docs/build"

      - name: "Check GitHub Pages status"
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "[Pages] GitHub Pages is enabled."
            echo "PAGES_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "[Pages] GitHub Pages is not enabled. Skipping deployment."
            echo "PAGES_ENABLED=false" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Setup GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/configure-pages@v6"

      - name: "Upload artifact to GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/upload-pages-artifact@v5"
        with:
          path: "./apps/docs/build"

      - name: "Deploy to GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/deploy-pages@v5"
