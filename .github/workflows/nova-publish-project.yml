# This file is generated by @cbnventures/nova.
# Do not edit manually.
#
# Run `nova generate github workflows` to regenerate.
# See: https://nova.cbnventures.io/docs/cli/generators/github/workflows

name: "Publish (project)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (project)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: "read"
    outputs:
      summary_work_0: "${{ steps.nova-summary.outputs.summary_work_0 }}"
      summary_workspace_0: "${{ steps.nova-summary.outputs.summary_workspace_0 }}"
      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
      summary_work_1: "${{ steps.nova-summary.outputs.summary_work_1 }}"
      summary_workspace_1: "${{ steps.nova-summary.outputs.summary_workspace_1 }}"
      summary_destination_1: "${{ steps.nova-summary.outputs.summary_destination_1 }}"
      summary_detail_1: "${{ steps.nova-summary.outputs.summary_detail_1 }}"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v7"
        timeout-minutes: 10
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        timeout-minutes: 20
        run: "npm install"
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          npm run check -- --workspace homebridge-adt-pulse-app-config-ui --workspace homebridge-adt-pulse --workspace homebridge-adt-pulse-docs --exclude-workspace ./
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        timeout-minutes: 30
        run: |
          npm run build -- --workspace homebridge-adt-pulse-app-config-ui --workspace homebridge-adt-pulse --workspace homebridge-adt-pulse-docs --artifact homebridge-adt-pulse --artifact documentation
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Write coverage badge"
        timeout-minutes: 30
        env:
          BADGE_PATH: "build/documentation/badges/coverage.json"
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';

          const summaryPaths = [];
          const visit = (directory) => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === '.git') {
                continue;
              }

              const entryPath = join(directory, entry.name);

              if (entry.isDirectory() === true) {
                visit(entryPath);
              } else if (entry.name === 'coverage-summary.json' && directory.endsWith('coverage') === true) {
                summaryPaths.push(entryPath);
              }
            }
          };

          visit('.');

          let covered = 0;
          let total = 0;

          for (const summaryPath of summaryPaths) {
            const lines = JSON.parse(readFileSync(summaryPath, 'utf-8'))['total']['lines'];

            covered += lines['covered'];
            total += lines['total'];
          }

          if (total === 0) {
            console.log('No coverage summaries were found, so no coverage badge was written.');
            process.exit(0);
          }

          const percent = Math.floor((covered / total) * 1000) / 10;
          const colors = [[90, 'brightgreen'], [80, 'green'], [70, 'yellowgreen'], [60, 'yellow'], [50, 'orange']];
          const match = colors.find((entry) => percent >= entry[0]);
          const color = (match === undefined) ? 'red' : match[1];

          mkdirSync(dirname(process.env.BADGE_PATH), { recursive: true });
          writeFileSync(process.env.BADGE_PATH, JSON.stringify({ schemaVersion: 1, label: 'coverage', message: percent + '%', color }) + String.fromCharCode(10));
          console.log('Wrote a ' + percent + '% coverage badge to ' + process.env.BADGE_PATH + '.');
          NODE
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Validate build artifacts"
        timeout-minutes: 30
        run: |
          set -euo pipefail

          ALLOWED_ROOT="${{ github.workspace }}"
          ALLOWED_ROOT="$(realpath "$ALLOWED_ROOT")"
          cd "$ALLOWED_ROOT"

          validate_artifact_root() {
            local artifact_root="$1"
            local candidate
            local candidate_parent
            local first_file
            local relative_candidate
            local resolved_candidate
            local resolved_root

            if [ ! -e "$artifact_root" ] && [ ! -L "$artifact_root" ]; then
              echo "Artifact root does not exist: $artifact_root" >&2
              exit 1
            fi

            if ! resolved_root="$(realpath "$artifact_root")"; then
              echo "Artifact root cannot be resolved: $artifact_root" >&2
              exit 1
            fi

            case "$resolved_root" in
              "$ALLOWED_ROOT"|"$ALLOWED_ROOT"/*) ;;
              *)
                echo "Artifact root escapes its allowed boundary: $artifact_root -> $resolved_root" >&2
                exit 1
                ;;
            esac

            while IFS= read -r -d '' candidate; do
              if ! resolved_candidate="$(realpath "$candidate")"; then
                echo "Artifact contains a broken symlink: $candidate" >&2
                exit 1
              fi

              case "$resolved_candidate" in
                "$resolved_root"|"$resolved_root"/*) ;;
                *)
                  echo "Artifact symlink escapes its root: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac

              candidate_parent="$(realpath "$(dirname "$candidate")")"

              case "$candidate_parent/" in
                "$resolved_candidate"/*)
                  echo "Artifact contains a recursive symlink: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -type l -print0)

            while IFS= read -r -d '' candidate; do
              if [ "$candidate" = "$artifact_root" ]; then
                relative_candidate="$(basename "$candidate")"
              else
                relative_candidate="${candidate#"$artifact_root"/}"
              fi

              case "/$relative_candidate" in
                */.env|*/.env.*|*/.npmrc|*/.netrc|*/.ssh|*/.ssh/*|*/.aws|*/.aws/*|*/.git|*/.git/*)
                  echo "Artifact contains a sensitive hidden path: $candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -print0)

            if [ -d "$artifact_root" ]; then
              if ! first_file="$(find -L "$artifact_root" -type f -print -quit)"; then
                echo "Artifact root could not be traversed safely: $artifact_root" >&2
                exit 1
              fi
            else
              first_file="$resolved_root"
            fi

            if [ -z "$first_file" ]; then
              echo "Artifact root contains no files: $artifact_root" >&2
              exit 1
            fi
          }

          validate_artifact_root "build/homebridge-adt-pulse"
          validate_artifact_root "build/documentation"

      - name: "Upload assembled artifact (homebridge-adt-pulse)"
        uses: "actions/upload-artifact@v7"
        timeout-minutes: 30
        with:
          name: "artifact-homebridge-adt-pulse"
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: "error"
          path: |
            build/homebridge-adt-pulse

      - name: "Upload assembled artifact (documentation)"
        uses: "actions/upload-artifact@v7"
        timeout-minutes: 30
        with:
          name: "artifact-documentation"
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: "error"
          path: |
            build/documentation

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Check project"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "homebridge-adt-pulse-app-config-ui, homebridge-adt-pulse, homebridge-adt-pulse-docs"
          NOVA_SUMMARY_ROW_0_DESTINATION: "Nova checks"
          NOVA_SUMMARY_ROW_0_DETAIL: ""
          NOVA_SUMMARY_ROW_1_WORK: "Build project"
          NOVA_SUMMARY_ROW_1_WORKSPACE: "homebridge-adt-pulse-app-config-ui, homebridge-adt-pulse, homebridge-adt-pulse-docs"
          NOVA_SUMMARY_ROW_1_DESTINATION: "Build artifacts"
          NOVA_SUMMARY_ROW_1_DETAIL: ""
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
            printf "summary_work_1=%s\\n" "$NOVA_SUMMARY_ROW_1_WORK"
            printf "summary_workspace_1=%s\\n" "$NOVA_SUMMARY_ROW_1_WORKSPACE"
            printf "summary_destination_1=%s\\n" "$NOVA_SUMMARY_ROW_1_DESTINATION"
            printf "summary_detail_1=%s\\n" "$NOVA_SUMMARY_ROW_1_DETAIL"
          } >> "$GITHUB_OUTPUT"

  publish-npm-packages-homebridge-adt-pulse:
    needs: "build"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: "read"
      id-token: "write"
    outputs:
      summary_work_0: "${{ steps.nova-summary.outputs.summary_work_0 }}"
      summary_workspace_0: "${{ steps.nova-summary.outputs.summary_workspace_0 }}"
      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
    steps:
      - name: "Check for Nova placeholders"
        timeout-minutes: 10
        env:
          PROJECT_NPM_TOKEN: "${{ secrets.PROJECT_NPM_TOKEN }}"
        run: |
          set -euo pipefail

          NOVA_PLACEHOLDER_FOUND="false"

          check_nova_placeholder() {
            if [[ "$2" == "NOVA_PLACEHOLDER" ]]; then
              printf '::error::%s still holds the Nova placeholder; set its real value in the repository settings.\n' "$1"
              NOVA_PLACEHOLDER_FOUND="true"
            fi
          }

          check_nova_placeholder "PROJECT_NPM_TOKEN" "$PROJECT_NPM_TOKEN"

          if [[ "$NOVA_PLACEHOLDER_FOUND" == "true" ]]; then
            exit 1
          fi

      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5

      - name: "Setup Node.js"
        uses: "actions/setup-node@v7"
        timeout-minutes: 10
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: "Remove deprecated .npmrc entries"
        timeout-minutes: 10
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          if [ -f "$npmrc" ]; then
            sed -i '/^always-auth=/d' "$npmrc"
          fi

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        timeout-minutes: 30
        with:
          name: "artifact-homebridge-adt-pulse"
          path: "build/homebridge-adt-pulse"

      - name: "Configure authentication"
        timeout-minutes: 5
        env:
          NPM_TOKEN: "${{ secrets.PROJECT_NPM_TOKEN }}"
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "[Auth] Using NPM_TOKEN (token-based)."
            echo "NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"
          else
            echo "[Auth] Using trusted publishing (OIDC)."

            npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

            if [ -f "$npmrc" ]; then
              sed -i '/^\/\/registry\.npmjs\.org\/:_authToken/d' "$npmrc"
              echo "[Auth] Removed _authToken entry from .npmrc."
            fi
          fi

      - name: "Publish package to npm"
        timeout-minutes: 30
        run: |
          if [ "${PUBLISH}" = "true" ]; then
            echo "[Publish] Production."
            npm publish --provenance --access public
          else
            echo "[Publish] Dry run."
            npm publish --dry-run
          fi
        working-directory: "build/homebridge-adt-pulse"

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Publish package"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "homebridge-adt-pulse"
          NOVA_SUMMARY_ROW_0_DESTINATION: "https://www.npmjs.com/package/homebridge-adt-pulse"
          NOVA_SUMMARY_ROW_0_DETAIL: "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
          } >> "$GITHUB_OUTPUT"

  publish-github-packages-packages-homebridge-adt-pulse:
    needs: "build"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: "read"
      packages: "write"
      id-token: "write"
    outputs:
      summary_work_0: "${{ steps.nova-summary.outputs.summary_work_0 }}"
      summary_workspace_0: "${{ steps.nova-summary.outputs.summary_workspace_0 }}"
      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5

      - name: "Setup Node.js"
        uses: "actions/setup-node@v7"
        timeout-minutes: 10
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Configure registry for GitHub Packages"
        uses: "actions/setup-node@v7"
        timeout-minutes: 5
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"

      - name: "Remove deprecated .npmrc entries"
        timeout-minutes: 10
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          if [ -f "$npmrc" ]; then
            sed -i '/^always-auth=/d' "$npmrc"
          fi

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        timeout-minutes: 30
        with:
          name: "artifact-homebridge-adt-pulse"
          path: "build/homebridge-adt-pulse"

      - name: "Change to scoped package name"
        timeout-minutes: 10
        run: |
          REPOSITORY_OWNER="@$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          PACKAGE_NAME=$(npm pkg get name --workspaces=false | jq -r '.')

          echo "[Scope] Owner is \"${REPOSITORY_OWNER}\" and package is \"${PACKAGE_NAME}\"."

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

          if [[ "$PACKAGE_NAME" != "$REPOSITORY_OWNER/"* ]]; then
            BASE=${PACKAGE_NAME##*/}
            NEW_NAME="$REPOSITORY_OWNER/$BASE"

            echo "[Scope] Scoping package name to \"${NEW_NAME}\"."

            npm pkg set name="$NEW_NAME"
          else
            echo "[Scope] Already scoped. No changes needed."
          fi
        working-directory: "build/homebridge-adt-pulse"

      - name: "Configure authentication"
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          echo "[Auth] Using GITHUB_TOKEN."
          echo "NODE_AUTH_TOKEN=${GITHUB_TOKEN}" >> "$GITHUB_ENV"

      - name: "Publish package to GitHub Packages"
        timeout-minutes: 30
        run: |
          if [ "${PUBLISH}" = "true" ]; then
            echo "[Publish] Production."
            npm publish
          else
            echo "[Publish] Dry run."
            npm publish --dry-run
          fi
        working-directory: "build/homebridge-adt-pulse"

      - name: "Restore package name"
        if: "${{ always() && env.PACKAGE_NAME }}"
        timeout-minutes: 10
        run: |
          npm pkg set name="$PACKAGE_NAME"
        working-directory: "build/homebridge-adt-pulse"

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Publish package"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "homebridge-adt-pulse"
          NOVA_SUMMARY_ROW_0_DESTINATION: "https://github.com/${{ github.repository_owner }}?tab=packages"
          NOVA_SUMMARY_ROW_0_DETAIL: "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
          } >> "$GITHUB_OUTPUT"

